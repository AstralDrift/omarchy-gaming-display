name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: Test and publish plugin archive
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep shellcheck

      - name: Verify tag, syntax, and tests
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(jq -r .version manifest.json)"
          bash -n bin/omarchy-gaming-display tests/*.sh tests/mocks/*
          shellcheck bin/omarchy-gaming-display tests/*.sh tests/mocks/*
          tests/test-manifest.sh
          tests/test-workflows.sh
          tests/test-cli.sh

      - name: Build release archive and checksum
        run: |
          archive="omarchy-gaming-display-${GITHUB_REF_NAME}.tar.gz"
          tar --create --gzip --file "$archive" \
            --transform 's,^,omarchy-gaming-display/,' \
            BarWidget.qml Panel.qml manifest.json bin/omarchy-gaming-display \
            README.md LICENSE CHANGELOG.md CONTRIBUTING.md SECURITY.md
          sha256sum "$archive" > "$archive.sha256"

      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: omarchy-gaming-display-${{ github.ref_name }}.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="omarchy-gaming-display-${GITHUB_REF_NAME}.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
