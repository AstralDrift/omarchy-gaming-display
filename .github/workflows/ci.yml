name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Shell and plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep shellcheck

      - name: Check Bash syntax
        run: bash -n bin/omarchy-gaming-display tests/*.sh tests/mocks/*

      - name: Run ShellCheck
        run: shellcheck bin/omarchy-gaming-display tests/*.sh tests/mocks/*

      - name: Validate plugin manifest
        run: tests/test-manifest.sh

      - name: Check workflow supply-chain pins
        run: tests/test-workflows.sh

      - name: Run mocked CLI integration tests
        run: tests/test-cli.sh
